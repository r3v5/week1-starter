<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dublin Spatial Analysis{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'map' %}">🗺️ Dublin Spatial Analysis</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'map' %}">Map</a>
                <a class="nav-link" href="{% url 'spatial_analysis:dashboard' %}">Dashboard</a>
                <a class="nav-link" href="{% url 'admin:index' %}">Admin</a>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <footer class="text-center text-muted py-4 mt-5 border-top">
        CMPU4058 - Advanced Web Mapping &middot; Dublin City Planning Department
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
